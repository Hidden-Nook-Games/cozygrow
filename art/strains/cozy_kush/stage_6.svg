<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- CozyGrow Platzhalter-Artwork: Cozy Kush, Stufe 6 (erntereif).
       Diese Stufe darf als einzige leuchten — sie ist der Moment, auf den
       der Spieler gewartet hat. -->
  <defs>
    <linearGradient id="potBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4794C"/>
      <stop offset="1" stop-color="#8E4E2C"/>
    </linearGradient>
    <linearGradient id="potRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9915F"/>
      <stop offset="1" stop-color="#A6603A"/>
    </linearGradient>
    <linearGradient id="budRipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E7A8"/>
      <stop offset="1" stop-color="#7FBE78"/>
    </linearGradient>
    <radialGradient id="ripeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0BC63" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#F0BC63" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F0BC63" stop-opacity="0"/>
    </radialGradient>
    <path id="leaflet" d="M0 0C-6-12-7-28 0-44 7-28 6-12 0 0Z"/>
    <g id="fan">
      <use href="#leaflet" transform="rotate(-58) scale(0.5)"/>
      <use href="#leaflet" transform="rotate(-31) scale(0.76)"/>
      <use href="#leaflet"/>
      <use href="#leaflet" transform="rotate(31) scale(0.76)"/>
      <use href="#leaflet" transform="rotate(58) scale(0.5)"/>
    </g>
  </defs>

  <circle cx="100" cy="92" r="86" fill="url(#ripeGlow)"/>
  <ellipse cx="100" cy="193" rx="50" ry="8" fill="#000" opacity="0.22"/>

  <g>
    <path d="M64 148h72l-8 38a8 8 0 0 1-8 7H80a8 8 0 0 1-8-7Z" fill="url(#potBody)"/>
    <path d="M72 150c-1 14 0 28 3 41h-4a8 8 0 0 1-6-6Z" fill="#fff" opacity="0.1"/>
    <rect x="54" y="129" width="92" height="19" rx="9" fill="url(#potRim)"/>
    <ellipse cx="100" cy="134" rx="38" ry="7.5" fill="#3E2C1D"/>
    <ellipse cx="100" cy="133" rx="38" ry="7.5" fill="#4A3524"/>
  </g>

  <g>
    <path d="M100 134V44" stroke="#4E8B48" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <g fill="#3D8047">
      <use href="#fan" transform="translate(100,128) rotate(-74) scale(0.68)"/>
      <use href="#fan" transform="translate(100,128) rotate(74) scale(0.68)"/>
    </g>
    <g fill="#47904D">
      <use href="#fan" transform="translate(100,110) rotate(-64) scale(0.6)"/>
      <use href="#fan" transform="translate(100,110) rotate(64) scale(0.6)"/>
    </g>
    <g fill="#55A657">
      <use href="#fan" transform="translate(100,90) rotate(-54) scale(0.5)"/>
      <use href="#fan" transform="translate(100,90) rotate(54) scale(0.5)"/>
    </g>
    <g fill="#63B361">
      <use href="#fan" transform="translate(100,68) rotate(-44) scale(0.4)"/>
      <use href="#fan" transform="translate(100,68) rotate(44) scale(0.4)"/>
    </g>

    <!-- Pralle, reife Blueten mit warmen Bluetennarben. -->
    <g fill="url(#budRipe)">
      <ellipse cx="100" cy="40" rx="12" ry="21"/>
      <ellipse cx="80" cy="88" rx="8" ry="13" transform="rotate(-20 80 88)"/>
      <ellipse cx="120" cy="88" rx="8" ry="13" transform="rotate(20 120 88)"/>
      <ellipse cx="86" cy="110" rx="6" ry="9" transform="rotate(-24 86 110)"/>
      <ellipse cx="114" cy="110" rx="6" ry="9" transform="rotate(24 114 110)"/>
    </g>
    <g stroke="#E5A855" stroke-width="1.7" stroke-linecap="round" fill="none">
      <path d="M96 32q-4-5-8-5"/>
      <path d="M104 38q4-5 9-5"/>
      <path d="M98 48q-4 4-8 4"/>
      <path d="M104 52q4 3 8 3"/>
    </g>
  </g>

  <g fill="#F2C776">
    <circle cx="146" cy="60" r="2.4" opacity="0.9"/>
    <circle cx="54" cy="78" r="1.8" opacity="0.75"/>
    <circle cx="136" cy="112" r="1.5" opacity="0.6"/>
    <circle cx="64" cy="46" r="1.6" opacity="0.7"/>
  </g>
</svg>
