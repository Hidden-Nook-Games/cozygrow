    <g fill="url(#bud)">
      <ellipse cx="100" cy="46" rx="9" ry="16"/>
      <ellipse cx="83" cy="88" rx="6" ry="10" transform="rotate(-18 83 88)"/>
      <ellipse cx="117" cy="88" rx="6" ry="10" transform="rotate(18 117 88)"/>
    </g>
    <g stroke="#E0A85C" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M97 40q-3-4-6-4"/>
      <path d="M103 44q3-4 6-4"/>
      <path d="M99 52q-3 3-6 3"/>
    </g>
  </g>

  <g fill="#E9B65F" opacity="0.55">
    <circle cx="144" cy="66" r="1.9"/>
    <circle cx="56" cy="86" r="1.4"/>
