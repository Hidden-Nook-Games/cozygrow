    <path d="M100 134v-16" stroke="#5AA055" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="88" cy="115" rx="11" ry="7" fill="#74C271" transform="rotate(-16 88 115)"/>
    <ellipse cx="112" cy="115" rx="11" ry="7" fill="#63B361" transform="rotate(16 112 115)"/>
    <path d="M92 114q-4 1-7 2" stroke="#3F7C43" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M108 114q4 1 7 2" stroke="#3F7C43" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <g fill="#E9B65F" opacity="0.5">
