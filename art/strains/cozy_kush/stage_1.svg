  </defs>

  <ellipse cx="100" cy="193" rx="50" ry="8" fill="#000" opacity="0.22"/>

  <g>
    <path d="M64 148h72l-8 38a8 8 0 0 1-8 7H80a8 8 0 0 1-8-7Z" fill="url(#potBody)"/>
    <path d="M72 150c-1 14 0 28 3 41h-4a8 8 0 0 1-6-6Z" fill="#fff" opacity="0.1"/>
    <rect x="54" y="129" width="92" height="19" rx="9" fill="url(#potRim)"/>
    <ellipse cx="100" cy="134" rx="38" ry="7.5" fill="#3E2C1D"/>
    <ellipse cx="100" cy="133" rx="38" ry="7.5" fill="#4A3524"/>
  </g>

  <!-- Keimblaetter: zwei runde, helle Blaetter an einem kurzen Stiel. -->
